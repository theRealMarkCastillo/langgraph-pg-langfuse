name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync --frozen
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .

  smoke:
    # Offline end-to-end run of the demos against a real Postgres (no LLM, no Langfuse).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18-trixie
        env:
          POSTGRES_USER: langgraph
          POSTGRES_PASSWORD: langgraph
          POSTGRES_DB: langgraph
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U langgraph -d langgraph"
          --health-interval 3s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync --frozen
      - run: ./scripts/smoke_test.sh
